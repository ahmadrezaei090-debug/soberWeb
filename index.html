<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شهر مافیا - در حال بارگذاری</title>
    <style>
        :root {
            --wood-dark: #0c0a09;
            --text-gold: #ffc947;
            --text-light: #e0dacc;
            --logo-glow-main: #ffdd00;
            --progress-bar-bg: rgba(0, 0, 0, 0.4);
            --progress-bar-fill-start: #8c4843;
            --progress-bar-fill-end: #ffc947;
            --countdown-bg: rgba(0, 0, 0, 0.3);
            --panel-glow: rgba(255, 201, 71, 0.5);
            /* Suspension styles */
            --suspension-red: #e74c3c;
            --suspension-border: #c0392b;
            --suspension-glow: rgba(231, 76, 60, 0.5);
            /* Viewport height variable for mobile browsers */
            --vh: 1vh;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-image: url('https://wallpapercave.com/wp/wp7158917.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            min-height: calc(var(--vh, 1vh) * 100);
            overflow: hidden;
            position: relative;
        }

        #preloader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--wood-dark);
            z-index: 100;
            animation: fadeOut 1s ease 1s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        #bottom-loader {
            width: 90%;
            max-width: 600px;
            padding: 20px;
            margin-bottom: 5vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        #progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: var(--progress-bar-bg);
            border: 1px solid var(--text-gold);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 10px var(--logo-glow-main);
        }

        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--progress-bar-fill-start), var(--progress-bar-fill-end));
            border-radius: 5px;
            transition: width 0.2s ease-in-out;
        }

        #status-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-gold);
            text-shadow: 1px 1px 2px black;
        }

        .panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            background-color: rgba(12, 10, 9, 0.85);
            border: 2px solid var(--text-gold);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px var(--panel-glow);
            z-index: 20;
            animation: fadeInPanel 0.5s ease forwards;
            opacity: 0;
        }
        
        @keyframes fadeInPanel {
            to {
                opacity: 1;
            }
        }

        .panel h1 {
            color: var(--text-gold);
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .panel p {
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .time-block {
            background-color: var(--countdown-bg);
            padding: 10px;
            border-radius: 5px;
            min-width: 60px;
        }

        .time-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-gold);
        }

        .time-label {
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        #maintenance-banner {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /* Suspension Panel Styles */
        #suspension-panel {
            border-color: var(--suspension-border);
            box-shadow: 0 0 20px var(--suspension-glow);
        }

        #suspension-panel h1 {
            color: var(--suspension-red);
        }

        #suspension-user-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        #suspension-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--suspension-border);
        }

        #suspension-username {
            font-size: 1.2rem;
            font-weight: bold;
        }

        #logout-btn {
            background-color: var(--text-gold);
            color: var(--wood-dark);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 20px;
        }

        #logout-btn:hover {
            background-color: #ffd76a;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .panel h1 {
                font-size: 1.3rem;
            }
            .time-value {
                font-size: 1.5rem;
            }
            .time-block {
                min-width: 50px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <div id="preloader-overlay"></div>

    <div id="bottom-loader" style="display: flex;">
        <div id="progress-bar-container">
            <div id="progress-bar-fill"></div>
        </div>
        <div id="status-container">
            <span id="status-message">در حال آماده سازی...</span>
            <span id="status-percentage"></span>
        </div>
    </div>

    <div id="maintenance-panel" class="panel" style="display: none;">
        <div id="maintenance-banner-container"><img id="maintenance-banner" src="" alt="بنر بروزرسانی"></div>
        <h1 id="maintenance-title"></h1>
        <p id="maintenance-message"></p>
        <div class="countdown-timer">
            <div class="time-block"><div id="days" class="time-value">00</div><div class="time-label">روز</div></div>
            <div class="time-block"><div id="hours" class="time-value">00</div><div class="time-label">ساعت</div></div>
            <div class="time-block"><div id="minutes" class="time-value">00</div><div class="time-label">دقیقه</div></div>
            <div class="time-block"><div id="seconds" class="time-value">00</div><div class="time-label">ثانیه</div></div>
        </div>
    </div>

    <div id="suspension-panel" class="panel" style="display: none;">
        <div id="suspension-user-info">
            <img id="suspension-avatar" src="" alt="آواتار کاربر">
            <h3 id="suspension-username"></h3>
        </div>
        <h1 id="suspension-title">حساب کاربری مسدود است</h1>
        <p id="suspension-reason"></p>
        <p id="suspension-message">زمان باقی‌مانده تا رفع مسدودیت:</p>
        <div id="suspension-countdown-timer" class="countdown-timer">
             <div class="time-block"><div id="s-days" class="time-value">00</div><div class="time-label">روز</div></div>
             <div class="time-block"><div id="s-hours" class="time-value">00</div><div class="time-label">ساعت</div></div>
             <div class="time-block"><div id="s-minutes" class="time-value">00</div><div class="time-label">دقیقه</div></div>
             <div class="time-block"><div id="s-seconds" class="time-value">00</div><div class="time-label">ثانیه</div></div>
        </div>
        <button id="logout-btn">تلاش مجدد</button>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- MOCK DATA ---
            // داده‌های شبیه‌سازی شده برای تست حالت‌های مختلف
            // برای تست هر حالت، مقدار آن را true و بقیه را false قرار دهید.
            const appState = {
                maintenanceMode: false, // حالت تعمیرات
                userSuspended: false,   // حالت مسدود بودن کاربر
                
                // داده‌های مربوط به حالت تعمیرات
                maintenanceData: {
                    title: "در حال بروزرسانی هستیم!",
                    message: "برای ارائه خدمات بهتر، سرورهای شهر مافیا به طور موقت از دسترس خارج شده‌اند. به زودی با امکانات جدید باز خواهیم گشت.",
                    bannerUrl: "https://media.wired.com/photos/5a55401d49197363595995c5/16:9/w_2400,h_1350,c_limit/Dog-Photos-Running-2.jpg",
                    // زمان پایان بروزرسانی (2 ساعت از الان)
                    endTime: new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString()
                },
                
                // داده‌های مربوط به مسدودیت کاربر
                suspensionData: {
                    username: "کاربر خاطی",
                    avatarUrl: "https://i.pravatar.cc/150?u=suspendeduser",
                    reason: "دلیل: استفاده از الفاظ نامناسب در چت عمومی.",
                    // زمان پایان مسدودیت (1 روز و 3 ساعت از الان)
                    endTime: new Date(Date.now() + 27 * 60 * 60 * 1000).toISOString()
                }
            };

            // انتخاب عناصر DOM
            const progressBarFill = document.getElementById('progress-bar-fill');
            const statusMessage = document.getElementById('status-message');
            const statusPercentage = document.getElementById('status-percentage');
            const bottomLoader = document.getElementById('bottom-loader');
            
            const maintenancePanel = document.getElementById('maintenance-panel');
            const suspensionPanel = document.getElementById('suspension-panel');

            let countdownInterval;

            // تابع برای فرمت کردن اعداد تایمر (مثلا: 7 -> 07)
            const formatTime = (time) => time < 10 ? `0${time}` : time;

            // تابع برای شروع شمارش معکوس
            function startCountdown(endTime, elements) {
                if (countdownInterval) clearInterval(countdownInterval);

                const updateTimer = () => {
                    const now = new Date().getTime();
                    const distance = new Date(endTime).getTime() - now;

                    if (distance < 0) {
                        clearInterval(countdownInterval);
                        elements.days.textContent = '00';
                        elements.hours.textContent = '00';
                        elements.minutes.textContent = '00';
                        elements.seconds.textContent = '00';
                        // می‌توانید در اینجا منطقی برای رفرش صفحه یا تلاش مجدد اضافه کنید
                        return;
                    }

                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    elements.days.textContent = formatTime(days);
                    elements.hours.textContent = formatTime(hours);
                    elements.minutes.textContent = formatTime(minutes);
                    elements.seconds.textContent = formatTime(seconds);
                };

                updateTimer();
                countdownInterval = setInterval(updateTimer, 1000);
            }

            // نمایش پنل تعمیرات
            function showMaintenanceMode(data) {
                bottomLoader.style.display = 'none';
                maintenancePanel.style.display = 'block';
                
                document.getElementById('maintenance-banner').src = data.bannerUrl;
                document.getElementById('maintenance-title').textContent = data.title;
                document.getElementById('maintenance-message').textContent = data.message;

                const timerElements = {
                    days: document.getElementById('days'),
                    hours: document.getElementById('hours'),
                    minutes: document.getElementById('minutes'),
                    seconds: document.getElementById('seconds')
                };
                startCountdown(data.endTime, timerElements);
            }

            // نمایش پنل مسدودیت
            function showSuspensionMode(data) {
                bottomLoader.style.display = 'none';
                suspensionPanel.style.display = 'block';

                document.getElementById('suspension-avatar').src = data.avatarUrl;
                document.getElementById('suspension-username').textContent = data.username;
                document.getElementById('suspension-reason').textContent = data.reason;

                const timerElements = {
                    days: document.getElementById('s-days'),
                    hours: document.getElementById('s-hours'),
                    minutes: document.getElementById('s-minutes'),
                    seconds: document.getElementById('s-seconds')
                };
                startCountdown(data.endTime, timerElements);
            }
            
            // شبیه‌سازی بارگذاری موفق
            function handleNormalLoad() {
                // در نسخه آفلاین، پس از لود موفق، می‌توانیم لودر را مخفی کرده
                // و یک پیام موفقیت نمایش دهیم یا به صفحه دیگری برویم.
                statusMessage.textContent = 'بارگذاری با موفقیت انجام شد!';
                // به صورت تستی بعد از 1 ثانیه لودر را مخفی می‌کنیم
                 setTimeout(() => {
                    bottomLoader.style.display = 'none';
                     // در یک پروژه واقعی، اینجا به صفحه اصلی هدایت می‌شوید
                     // window.location.href = '/home.html';
                 }, 1000);
            }

            // تابع اصلی برای شروع برنامه
            function initializeApp() {
                let progress = 0;
                const messages = [
                    "بررسی اتصال...",
                    "دریافت اطلاعات کاربر...",
                    "بارگذاری منابع بازی...",
                    "آماده سازی محیط...",
                    "ورود به شهر..."
                ];
                let messageIndex = 0;

                const loadingInterval = setInterval(() => {
                    progress += Math.random() * 5 + 1;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(loadingInterval);
                        
                        // بررسی وضعیت برنامه پس از اتمام لود
                        if (appState.maintenanceMode) {
                            showMaintenanceMode(appState.maintenanceData);
                        } else if (appState.userSuspended) {
                            showSuspensionMode(appState.suspensionData);
                        } else {
                            handleNormalLoad();
                        }
                    }

                    if (progress > (messageIndex + 1) * 20 && messageIndex < messages.length -1) {
                        messageIndex++;
                        statusMessage.textContent = messages[messageIndex];
                    }
                    
                    progressBarFill.style.width = `${progress}%`;
                    statusPercentage.textContent = `${Math.round(progress)}%`;

                }, 150);
            }
            
            // دکمه تلاش مجدد (در اینجا صفحه را رفرش می‌کند)
            document.getElementById('logout-btn').addEventListener('click', () => {
                location.reload();
            });

            // برای حل مشکل 100vh در موبایل
            const setVh = () => {
                const vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
            };
            window.addEventListener('resize', setVh);
            setVh();
            
            // شروع برنامه
            initializeApp();
        });
    </script>
</body>
</html>
