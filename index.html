<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروع فصل ۱</title>
    <!-- اتصال به Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* استفاده از فونت استاندارد برای خوانایی بهتر */
        body {
            font-family: 'Inter', sans-serif, 'Vazirmatn';
            background-color: #000;
            color: #ccc;
            overflow: hidden; /* جلوگیری از اسکرول */
        }

        /* انیمیشن محو شدن برای صفحه اول - حذف شد */
        /* @keyframes fade-in-out { ... } */
        /* .animate-fade-in-out { ... } */

        /* انیمیشن جدید محو شدن به بیرون */
        @keyframes fade-out {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .animate-fade-out {
            animation: fade-out 1s ease-in-out forwards;
        }

        /* انیمیشن محو شدن ساده برای ورود */
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fade-in 2s ease-in forwards;
        }

        /* انیمیشن چشمک زدن نشانگر تایپ */
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #555; }
        }
        .caret::after {
            content: '_';
            animation: blink-caret 1s step-end infinite;
            margin-right: 4px;
            font-weight: bold;
            color: #777;
        }
        .typing-done::after {
            display: none; /* حذف نشانگر بعد از اتمام تایپ */
        }
        
        /* افکت سایه تاریک در گوشه‌های صفحه */
        .vignette-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 10vw 5vw rgba(0,0,0,0.9);
            pointer-events: none; /* اجازه کلیک از میان آن */
            z-index: 100;
        }

        /* استایل ساختمان‌های تاریک */
        .building-container {
            position: absolute;
            bottom: 6rem; /* همان ارتفاع زمین */
            left: 0;
            width: 100%;
            height: 60vh;
            z-index: 20;
            opacity: 0.7;
        }
        .building {
            position: absolute;
            bottom: 0;
            background-color: #0a0a0a; /* کمی روشن‌تر از پس‌زمینه */
            border-top: 1px solid #1a1a1a;
        }

        /* انیمیشن جدید حرکت کاراکتر به چپ */
        @keyframes move-left {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-80vw); /* حرکت به اندازه ۸۰ درصد عرض صفحه به چپ */
            }
        }
        .move-container-left {
            animation: move-left 25s linear 1s forwards; /* ۲۵ ثانیه طول می‌کشد، ۱ ثانیه تاخیر دارد */
        }

        /* انیمیشن "نفس کشیدن" یا ایستادن کاراکتر */
        @keyframes subtle-idle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .character-idle {
            animation: subtle-idle 4s ease-in-out infinite;
            /* افکت سایه قرمز تیره برای حس رمزآلود */
            filter: brightness(0.9) drop-shadow(0 0 15px rgba(100, 0, 0, 0.4));
        }
    </style>
</head>
<body class="bg-black text-gray-300 h-screen w-screen overflow-hidden">

    <!-- پرده اول: پیام فارسی -->
    <div id="screen1" class="absolute inset-0 flex items-center justify-center p-8">
        <h1 class="text-3xl md:text-5xl font-medium text-center leading-relaxed">
            <span id="s1_line1" class="caret"></span>
            <br>
            <span id="s1_line2"></span>
        </h1>
    </div>

    <!-- پرده دوم: افکت کدنویسی -->
    <div id="screen2" class="absolute inset-0 flex items-center justify-center p-8 hidden" dir="ltr">
        <div class="w-full max-w-3xl font-mono text-lg md:text-2xl text-gray-400">
            <div class="mb-4">
                <span class="text-green-600">&gt; </span>
                <span id="line1" class="caret"></span>
            </div>
            <div id="line2-container" class="hidden">
                <span class="text-green-600">&gt; </span>
                <span id="line2" class="caret"></span>
            </div>
        </div>
    </div>

    <!-- پرده سوم: صحنه بازی -->
    <div id="screen3" class="absolute inset-0 hidden opacity-0 animate-fade-in">
        <!-- صحنه -->
        <div class="relative w-full h-full">
            
            <!-- زمین -->
            <div class="absolute bottom-0 left-0 w-full h-24 bg-gray-900 z-30" style="background-color: #050505;"></div>

            <!-- ساختمان‌های پس‌زمینه -->
            <div class="building-container">
                <!-- ساختمان ۱ (دورتر) -->
                <div class="building" style="left: 5%; width: 15%; height: 50vh; background-color: #080808;"></div>
                <!-- ساختمان ۲ -->
                <div class="building" style="left: 22%; width: 10%; height: 40vh; background-color: #050505;"></div>
                <!-- ساختمان ۳ (نزدیک‌تر) -->
                <div class="building" style="left: 35%; width: 20%; height: 60vh; background-color: #0a0a0a;"></div>
                <!-- ساختمان ۴ -->
                <div class="building" style="left: 58%; width: 12%; height: 45vh; background-color: #070707;"></div>
                 <!-- ساختمان ۵ (دور) -->
                <div class="building" style="left: 75%; width: 10%; height: 35vh; background-color: #050505;"></div>
            </div>

            <!-- کاراکتر -->
            <!-- محفظه کاراکتر برای مدیریت حرکت افقی -->
            <div id="character-container" class="absolute bottom-24 right-[10%] w-32 md:w-40 h-auto z-40">
                <img src="https://s6.uupload.ir/files/copilot_image_1763379586224_c8rr.jpeg" 
                     alt="کاراکتر"
                     onerror="this.src='https://placehold.co/160x320/000/333?text=Character\nNot+Found'"
                     class="w-full h-auto character-idle"> <!-- کلاس 'character-idle' به 'img' منتقل شد -->
            </div>

        </div>
        <!-- افکت ویگنت (تاریکی دور صفحه) -->
        <div class="vignette-overlay"></div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const screen1 = document.getElementById('screen1');
            const screen2 = document.getElementById('screen2');
            const screen3 = document.getElementById('screen3');
            
            const s1_line1 = document.getElementById('s1_line1');
            const s1_line2 = document.getElementById('s1_line2');
            const line1El = document.getElementById('line1');
            const line2Container = document.getElementById('line2-container');
            const line2El = document.getElementById('line2');

            const text_s1_l1 = "ـ چرا اصلا داری بازی میکنی؟";
            const text_s1_l2 = "اینجا هیچ چیزی در انتظار تو نیست.";
            const text1 = "Initializing Chapter 1...";
            const text2 = "Everything in this world is deceptive. Believe nothing.";
            const typeSpeed = 90; // سرعت تایپ (میلی‌ثانیه)

            // تابع برای افکت تایپ
            function typeWriter(element, text, speed, onComplete) {
                let i = 0;
                function type() {
                    if (i < text.length) {
                        element.innerHTML = text.substring(0, i + 1);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        element.classList.add('typing-done'); // حذف نشانگر
                        if (onComplete) {
                            onComplete();
                        }
                    }
                }
                type();
            }

            // --- شروع سکانس ---

            // ۱. تایپ پرده اول
            typeWriter(s1_line1, text_s1_l1, typeSpeed, () => {
                s1_line1.classList.add('typing-done');
                s1_line2.classList.add('caret');
                
                typeWriter(s1_line2, text_s1_l2, typeSpeed, () => {
                    s1_line2.classList.add('typing-done');

                    // ۲. بعد از اتمام تایپ، ۷ ثانیه صبر می‌کند
                    setTimeout(() => {
                        // ۳. پرده اول محو می‌شود
                        screen1.classList.add('animate-fade-out');

                        // ۴. بعد از ۱ ثانیه (زمان محو شدن)، پرده دوم را شروع کن
                        setTimeout(() => {
                            screen1.classList.add('hidden');
                            screen2.classList.remove('hidden');

                            // ۵. شروع تایپ خط اول پرده دوم
                            typeWriter(line1El, text1, typeSpeed, () => {
                                // ۶. بعد از اتمام خط اول، خط دوم ظاهر و تایپ می‌شود
                                setTimeout(() => {
                                    line2Container.classList.remove('hidden');
                                    typeWriter(line2El, text2, typeSpeed, () => {
                                        // ۷. بعد از اتمام خط دوم، با ۲ ثانیه تاخیر، پرده سوم ظاهر می‌شود
                                        setTimeout(() => {
                                            screen2.classList.add('hidden');
                                            screen3.classList.remove('hidden');
                                            // ۸. همزمان با ظاهر شدن پرده ۳، حرکت کاراکتر را فعال کن
                                            document.getElementById('character-container').classList.add('move-container-left');
                                        }, 2000); 
                                    });
                                }, 500); // تاخیر کوتاه قبل از شروع خط دوم
                            });
                        }, 1000); // زمان انیمیشن محو شدن

                    }, 7000); // زمان نمایش پرده اول بعد از اتمام تایپ
                });
            });
        });
    </script>

</body>
</html>
