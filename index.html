<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی هوشیار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- Base & Fonts --- */
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #050505;
            color: #E0E0E0;
            overscroll-behavior: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Gold Theme --- */
        .gold-text {
            color: #FFD700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        
        .btn-main {
            background: linear-gradient(180deg, #F0C040 0%, #c39d1a 100%);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            color: #000;
            font-weight: 800;
            border-radius: 50px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-main:active {
            transform: scale(0.96);
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.2);
        }

        /* --- Top Right Profile Corner --- */
        .profile-corner {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            border-radius: 50px; /* Pill shape */
            padding: 5px 8px 5px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }
        .profile-corner:active {
            border-color: #FFD700;
        }

        .corner-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #FFD700;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Settings Button (Top Left) --- */
        .settings-btn-circle {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
            color: #ccc;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .settings-btn-circle:active { color: #FFD700; border-color: #FFD700; }

        /* --- Footer --- */
        .footer-circle-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
            color: #FFD700;
            transition: all 0.2s;
        }
        .footer-circle-btn:active { background: #333; transform: scale(0.9); }

        /* --- Modals --- */
        .screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            flex-direction: column;
            animation: fadeIn 0.4s ease;
        }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-overlay {
            background-color: rgba(0,0,0,0.92);
            backdrop-filter: blur(5px);
        }

        .profile-box-outer {
            background: #111;
            border: 1px solid #FFD700;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }

        /* Game Elements */
        .btn-option {
            background-color: #1a1a1a;
            border: 1px solid #444;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            transition: all 0.2s;
            width: 100%;
        }
        .correct-flash { background-color: #04d182 !important; border-color: #04d182 !important; color: #000; }
        .wrong-flash { background-color: #ef4444 !important; border-color: #ef4444 !important; }

        #timer-bar-container {
            width: 100%; height: 6px; background: #333; border-radius: 3px; margin-bottom: 20px; overflow: hidden;
        }
        #timer-bar { height: 100%; background: #FFD700; width: 100%; transition: width 1s linear; }

        .flash-input {
            width: 100%; padding: 16px; font-size: 1.25rem;
            background: rgba(255,255,255,0.1); border: 2px solid #555;
            border-radius: 12px; color: #fff; text-align: center; outline: none;
        }
        .flash-input:focus { border-color: #FFD700; }

        .btn-skip {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            border: 1px solid #818cf8; color: white; font-size: 0.8rem;
            padding: 4px 12px; border-radius: 20px; box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); } 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }

    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-black">

<!-- 1. MAIN MENU SCREEN -->
<div id="main-menu-screen" class="screen h-full justify-between p-6 relative active">
    
    <!-- TOP LEFT: Settings -->
    <div class="absolute top-6 left-6 z-20">
        <button id="settings-btn" class="settings-btn-circle">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>
    </div>

    <!-- TOP RIGHT: Profile (Corner Style) -->
    <div class="absolute top-6 right-6 z-20">
        <div class="profile-corner">
            <!-- Text Info -->
            <div class="flex flex-col items-end justify-center">
                <div class="text-white font-bold text-sm leading-tight flex items-center gap-1">
                    هوشیار <span class="text-[10px] text-gray-500">✏️</span>
                </div>
                <div class="text-yellow-400 font-bold text-sm tracking-wide mt-1">
                    <span id="menu-coins">500</span> 🪙
                </div>
                <!-- Hidden fields for logic -->
                <span id="menu-score" class="hidden">0</span>
                <span id="menu-tickets" class="hidden">0</span>
            </div>

            <!-- Avatar -->
            <div class="corner-avatar">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-300" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                </svg>
            </div>
        </div>
    </div>

    <!-- Center Content (Title & Main Buttons) -->
    <div class="flex flex-col items-center justify-center w-full h-full pb-10">
        <!-- Big Logo Title -->
        <h1 class="text-7xl font-black gold-text mb-12 tracking-tighter" style="font-family: 'Vazirmatn', sans-serif;">
            هوشیار
        </h1>

        <!-- Main Buttons -->
        <div class="w-full max-w-xs space-y-5">
            <button id="open-mode-modal-btn" class="btn-main w-full py-4 text-2xl shadow-xl hover:scale-105 transition-transform">
                شروع بازی
            </button>
            <button id="challenges-btn" class="btn-main w-full py-4 text-xl opacity-80" style="filter: grayscale(0.2); background: #333; color: #aaa; box-shadow:none; border: 1px solid #444;">
                آرشیو
            </button>
        </div>
    </div>

    <!-- Footer Icons -->
    <div class="w-full flex justify-center items-center space-x-8 space-x-reverse pb-6">
        <button class="footer-circle-btn"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg></button>
        <button class="footer-circle-btn" style="width: 70px; height: 70px; border-color: #F0C040; box-shadow: 0 0 15px rgba(255,215,0,0.1);"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg></button>
        <button id="daily-challenge-btn" class="footer-circle-btn hover:text-indigo-400 hover:border-indigo-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        </button>
    </div>
</div>

<!-- MODE SELECTION MODAL -->
<div id="mode-modal" class="fixed inset-0 z-50 hidden modal-overlay flex justify-center items-center">
    <div class="profile-box-outer w-11/12 max-w-sm text-center animate-bounce-in bg-black">
        <h2 class="text-2xl font-black gold-text mb-6">انتخاب سبک بازی</h2>
        <div class="space-y-4">
            <button onclick="selectMode('old')" class="btn-option flex flex-col items-center py-4 hover:bg-yellow-900/30">
                <span class="text-xl font-bold text-yellow-400">2 Old (کلاسیک)</span>
                <span class="text-xs text-gray-400 mt-1">۴ گزینه‌ای | ۳ جان</span>
            </button>
            <button onclick="selectMode('flash')" class="btn-option flex flex-col items-center py-4 hover:bg-yellow-900/30">
                <span class="text-xl font-bold text-yellow-400">2.5 Flash (تایپی)</span>
                <span class="text-xs text-gray-400 mt-1">تایپ پاسخ | ۳۰ ثانیه زمان</span>
            </button>
        </div>
        <button id="close-mode-btn" class="mt-6 text-gray-500 text-sm border-b border-gray-600">انصراف</button>
    </div>
</div>

<!-- SPECIAL CHALLENGE MODAL -->
<div id="challenge-modal" class="fixed inset-0 z-50 hidden modal-overlay flex justify-center items-center">
    <div class="profile-box-outer w-11/12 max-w-sm text-center bg-black" style="border-color: #818cf8;">
        <div class="w-16 h-16 bg-indigo-900 rounded-full mx-auto flex items-center justify-center mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        </div>
        <h2 class="text-2xl font-black text-indigo-400 mb-2">چالش سرعت</h2>
        <p class="text-gray-300 text-sm mb-6 leading-6">
            به ۳ سوال در حالت تایپی (Flash) پشت سر هم پاسخ درست بدهید.
        </p>
        <div class="bg-gray-800 rounded-xl p-3 mb-6 border border-gray-700">
            <p class="text-xs text-gray-400 mb-1">جایزه:</p>
            <p class="text-white font-bold text-lg">🎟️ 1x بلیط رد کردن سوال</p>
        </div>
        <button onclick="startChallengeRun()" class="btn-main w-full py-3 text-lg shadow-lg" style="background: linear-gradient(180deg, #6366f1 0%, #4338ca 100%); color: white;">شروع چالش</button>
        <button id="close-challenge-btn" class="mt-4 text-gray-500 text-sm">بستن</button>
    </div>
</div>

<!-- 2. GAMEPLAY SCREEN -->
<div id="gameplay-screen" class="screen p-6 justify-between">
    <header class="flex justify-between items-center w-full pt-4">
        <button id="exit-game-btn" class="text-red-500 font-bold px-3 py-1 border border-red-900 rounded bg-red-900/20">خروج</button>
        <button id="skip-btn" class="hidden btn-skip" onclick="useSkipTicket()">🎟️ رد کردن سوال</button>
        <div class="text-lg font-bold text-right">
            <div id="score-display">امتیاز: <span id="game-score" class="gold-text">0</span></div>
            <div id="challenge-progress" class="hidden text-sm text-indigo-400">پیشرفت: <span id="challenge-count">0</span>/3</div>
        </div>
    </header>
    
    <div class="w-full flex justify-end px-1 mt-1">
        <span id="game-stats" class="text-lg font-bold">❤️ 3</span>
    </div>

    <main class="flex-grow flex flex-col justify-center items-center w-full max-w-md mx-auto">
        <div class="profile-box-outer w-full p-8 mb-8 text-center bg-gray-900/90 relative">
             <div id="timer-bar-container" class="absolute top-0 left-0 right-0 hidden rounded-t-xl" style="margin:0;">
                <div id="timer-bar"></div>
            </div>
            <p id="riddle-text" class="text-xl leading-8 font-bold text-gray-200 mt-2">...</p>
        </div>

        <div id="options-container" class="grid grid-cols-2 gap-4 w-full"></div>

        <div id="flash-container" class="w-full flex flex-col items-center hidden">
            <input type="text" id="flash-input" class="flash-input" placeholder="پاسخ را بنویسید...">
            <button id="flash-submit-btn" class="btn-main w-full py-3 mt-4 text-lg">ثبت پاسخ</button>
        </div>
    </main>
</div>

<!-- 3. GAME OVER SCREEN -->
<div id="game-over-screen" class="screen justify-center items-center p-8 text-center">
    <h1 id="game-over-title" class="text-5xl font-black mb-6 gold-text">پایان بازی</h1>
    <p id="game-over-msg" class="text-2xl text-gray-300 mb-2">امتیاز شما: <span id="final-score" class="text-white">0</span></p>
    
    <div class="w-full max-w-xs space-y-4 mt-8">
        <button id="play-again-btn" class="btn-main w-full py-3">بازی مجدد</button>
        <button id="back-to-menu-btn" class="w-full py-3 border border-gray-600 rounded-xl text-gray-400">بازگشت به منو</button>
    </div>
</div>

<!-- Toast -->
<div id="toast-modal" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 border border-gold px-6 py-3 rounded-full shadow-xl z-50 transition-all duration-300 opacity-0 pointer-events-none">
    <p id="toast-msg" class="text-gold text-sm font-bold">⚠️ این بخش به زودی اضافه می‌شود</p>
</div>

<script>
    // --- Database ---
    const riddles = [
        { riddle: "آن چیست که همه جا هست ولی جایی را اشغال نمی‌کند؟", options: ["هوا", "فکر", "نور", "فضا"], answer: "هوا" },
        { riddle: "آن چیست که پر دارد ولی پرواز نمی‌کند؟", options: ["کتاب", "بالش", "در", "هواپیما"], answer: "بالش" },
        { riddle: "آن چیست که روز را آغاز می‌کند و شب را به پایان می‌رساند؟", options: ["حرف ر", "خورشید", "ماه", "حرف ب"], answer: "حرف ر" },
        { riddle: "آن چیست که هرچه از آن بردارند بزرگتر می‌شود؟", options: ["چاله", "سن", "علم", "کوه"], answer: "چاله" },
        { riddle: "آن چیست که یک چشم دارد ولی نمی‌بیند؟", options: ["سوزن", "حلقه", "دکمه", "سکه"], answer: "سوزن" },
        { riddle: "آن چیست که گردن دارد ولی سر ندارد؟", options: ["کوزه", "پیراهن", "بطری", "گیتار"], answer: "پیراهن" },
        { riddle: "آن چیست که زبان ندارد اما راست می‌گوید؟", options: ["آینه", "کتاب", "ساعت", "ترازو"], answer: "آینه" },
        { riddle: "آن چیست که اگر در آب بیفتد خیس نمی‌شود؟", options: ["روغن", "نور", "سایه", "یخ"], answer: "سایه" },
        { riddle: "آن چیست که دندان دارد اما چیزی نمی‌خورد؟", options: ["شانه", "اره", "کیف", "دهان"], answer: "شانه" },
        { riddle: "آن چیست که شهر دارد اما خانه نه، کوه دارد اما درخت نه؟", options: ["نقشه", "کره زمین", "رویا", "بیابان"], answer: "نقشه" },
        { riddle: "آن چیست که بی‌صدا زنگ می‌زند؟", options: ["تلفن", "آهن", "ساعت", "در"], answer: "آهن" },
        { riddle: "برادرِ پدرِ توست، اما عموی تو نیست؟", options: ["دایی", "پدر", "عمه", "پدربزرگ"], answer: "پدر" },
        { riddle: "آن چیست که متعلق به توست اما دیگران بیشتر از تو از آن استفاده می‌کنند؟", options: ["پول", "اسم", "زمان", "ماشین"], answer: "اسم" },
        { riddle: "آن چیست که وقتی خشک می‌شود خیس می‌شود؟", options: ["حوله", "یخ", "چوب", "برف"], answer: "حوله" },
        { riddle: "آن چیست که هر چه بیشتر باشد، کمتر می‌بینید؟", options: ["مه", "نور", "تاریکی", "پرده"], answer: "تاریکی" },
        { riddle: "آن چیست که جان دارد ولی نفس نمی‌کشد؟", options: ["ماهی", "فنجان", "گیاه", "بادکنک"], answer: "فنجان" },
        { riddle: "آن چیست که چهار پا دارد اما راه نمی‌رود؟", options: ["میز", "اسب", "لاکپشت", "ماشین"], answer: "میز" },
        { riddle: "آن چیست که کلیدهای زیادی دارد اما نمی‌تواند دری را باز کند؟", options: ["پیانو", "نقشه", "زندان", "قفل"], answer: "پیانو" },
        { riddle: "آن چیست که بالا می‌رود اما هرگز پایین نمی‌آید؟", options: ["سن", "باران", "دود", "قیمت"], answer: "سن" },
        { riddle: "آن چیست که شکستنش واجب است تا بتوان از آن استفاده کرد؟", options: ["تخم مرغ", "گردو", "قول", "سکوت"], answer: "تخم مرغ" },
        { riddle: "آن چیست که سر ندارد اما کلاه دارد؟", options: ["قارچ", "میخ", "عصا", "بطری"], answer: "قارچ" },
        { riddle: "آن چیست که پا دارد اما راه نمی‌رود؟", options: ["شلوار", "میز", "صندلی", "نردبان"], answer: "شلوار" },
        { riddle: "آن چیست که رنگش سفید است اما قند نیست، ریشه دارد اما درخت نیست؟", options: ["دندان", "پیاز", "سیر", "ترب"], answer: "دندان" },
        { riddle: "آن چیست که در رادیو و دریا مشترک است؟", options: ["موج", "صدا", "آب", "پیام"], answer: "موج" },
        { riddle: "آن چیست که وقتی تمیز است سیاه است و وقتی کثیف است سفید؟", options: ["تخته سیاه", "کفش", "زغال", "شب"], answer: "تخته سیاه" },
        { riddle: "آن چیست که گوش دارد ولی نمی‌شنود؟", options: ["دیگ", "سوزن", "ذرت", "فنجان"], answer: "دیگ" },
        { riddle: "آن چیست که هر چه می‌دوی به آن نمی‌رسی؟", options: ["سایه", "خورشید", "باد", "زمان"], answer: "سایه" },
        { riddle: "آن کدام پرنده‌ای است که اگر نامش را برعکس کنی نام پرنده دیگری می‌شود؟", options: ["زاغ", "غاز", "باز", "درنا"], answer: "زاغ" },
        { riddle: "آن چیست که شیرین است اما مزه ندارد؟", options: ["قند", "شکر", "خواب", "عسل"], answer: "خواب" },
        { riddle: "آن چیست که دو سر دارد و یک کمر؟", options: ["قیچی", "عینک", "دوچرخه", "انسان"], answer: "قیچی" },
        { riddle: "آن چیست که در هوا می‌پرد ولی بال و پر ندارد؟", options: ["بادبادک", "هواپیما", "ابر", "غبار"], answer: "بادبادک" },
        { riddle: "آن چیست که فقط با نام بردنش می‌شکند؟", options: ["شیشه", "سکوت", "دل", "یخ"], answer: "سکوت" },
        { riddle: "آن چیست که چشم دارد اما نمی‌بیند، پوست دارد اما بدن ندارد؟", options: ["سیب زمینی", "مار", "کفش", "درخت"], answer: "سیب زمینی" },
        { riddle: "آن چیست که اشک دارد اما چشم ندارد؟", options: ["ابر", "شمع", "پیاز", "دریا"], answer: "شمع" },
        { riddle: "آن چیست که هر چه آن را می‌کشیم کوتاه‌تر می‌شود؟", options: ["سیگار", "طناب", "خط", "زمان"], answer: "سیگار" },
        { riddle: "آن چیست که برگ دارد اما درخت نیست، شیرازه دارد اما کتاب نیست؟", options: ["دفتر", "کاهو", "تقویم", "روزنامه"], answer: "کاهو" },
        { riddle: "آن چیست که همیشه دست به کمر ایستاده است؟", options: ["آفتابه", "سماور", "فنجان", "کوزه"], answer: "آفتابه" },
        { riddle: "آن چیست که آتش است اما دود ندارد؟", options: ["برق", "عشق", "فلفل", "خورشید"], answer: "برق" },
        { riddle: "آن چیست که همه می‌خورند ولی سیر نمی‌شوند؟", options: ["غصه", "هوا", "کتک", "آب"], answer: "غصه" },
        { riddle: "آن چیست که یک پا دارد و سه چشم؟", options: ["چراغ راهنما", "عینک", "دوربین", "سوزن"], answer: "چراغ راهنما" },
        { riddle: "آن چیست که پوستش را می‌کند و گریه می‌کنند؟", options: ["پیاز", "سیب", "موز", "نارگیل"], answer: "پیاز" },
        { riddle: "آن چیست که در زمستان خانه را گرم می‌کند و در تابستان درخت را خنک؟", options: ["برگ", "بخاری", "کولر", "آفتاب"], answer: "برگ" },
        { riddle: "آن چیست که اولش عبادت است و آخرش آشامیدنی؟", options: ["شام", "سحر", "چای", "آب"], answer: "شام" },
        { riddle: "آن چیست که هزاران چشم دارد اما نمی‌بیند؟", options: ["آسمان", "الک", "تور ماهیگیری", "زنبور"], answer: "الک" },
        { riddle: "آن چیست که می‌رود اما بر نمی‌گردد؟", options: ["عمر", "راه", "رودخانه", "باد"], answer: "عمر" },
        { riddle: "آن چیست که بی زبان سخن می‌گوید و بی پا راه می‌رود؟", options: ["نامه", "کتاب", "تلفن", "رادیو"], answer: "نامه" },
        { riddle: "آن چیست که هر چه پاکش کنی کثیف‌تر می‌شود؟", options: ["آب", "دستمال", "صابون", "تخته"], answer: "آب" },
        { riddle: "آن چیست که سر دارد، ته دارد، اما بدن ندارد؟", options: ["سکه", "کتاب", "صف", "جاده"], answer: "صف" },
        { riddle: "آن چیست که تا اسمش را صدا می‌زنی ناپدید می‌شود؟", options: ["سکوت", "تاریکی", "راز", "خواب"], answer: "سکوت" },
        { riddle: "آن چیست که وقتی هوا گرم است لباس می‌پوشد و وقتی سرد است لخت می‌شود؟", options: ["درخت", "کوه", "زمین", "انسان"], answer: "درخت" },
        { riddle: "آن چیست که با بریدن سرش، زنده می‌شود؟", options: ["خز", "بالش", "دکمه", "قارچ"], answer: "خز" },
        { riddle: "آن چیست که روز و شب راه می‌رود اما خسته نمی‌شود؟", options: ["آب", "ساعت", "خورشید", "قلب"], answer: "ساعت" },
        { riddle: "آن چیست که هم در آشپزخانه است هم در اتومبیل؟", options: ["دنده", "چرخ", "فرمان", "صندلی"], answer: "دنده" },
        { riddle: "آن چیست که نه دست دارد و نه پا، اما از همه جا بالا می‌رود؟", options: ["دود", "پیچک", "سایه", "باد"], answer: "دود" },
        { riddle: "آن چیست که وقتی می‌خندد لب‌هایش باز نمی‌شود؟", options: ["پسته", "انار", "گردو", "فندق"], answer: "پسته" },
        { riddle: "آن چیست که پر دارد اما پرواز نمی‌کند، و اگر آب بخورد می‌میرد؟", options: ["آتش", "بالش", "قند", "کاغذ"], answer: "آتش" },
        { riddle: "آن چیست که هر چه تندتر بدود، زودتر به زمین می‌خورد؟", options: ["دوچرخه", "چرخ", "آبشار", "عمر"], answer: "دوچرخه" },
        { riddle: "آن چیست که با اینکه پا ندارد اما سفر می‌کند؟", options: ["تمبر", "نامه", "پول", "همه موارد"], answer: "همه موارد" },
        { riddle: "آن چیست که در آب غرق نمی‌شود و در آتش نمی‌سوزد؟", options: ["یخ", "جیوه", "سایه", "خاک"], answer: "یخ" },
        { riddle: "آن چیست که یک نفر دارد، دو نفر دارد، اما سه نفر ندارد؟", options: ["راز", "پول", "دوست", "نام"], answer: "راز" },
        { riddle: "آن چیست که سرخ است اما سیب نیست، لایه لایه است اما پیاز نیست؟", options: ["انار", "گل رز", "کلم قرمز", "لبو"], answer: "انار" },
        { riddle: "آن چیست که اول چهار پا دارد، بعد دو پا، و در آخر سه پا؟", options: ["انسان", "میمون", "قورباغه", "میز"], answer: "انسان" },
        { riddle: "آن چیست که همه آن را دارند ولی هیچکس نمی‌تواند آن را از دست بدهد؟", options: ["سایه", "گذشته", "نام", "خاطره"], answer: "سایه" },
        { riddle: "آن چیست که مادر همه چیز است؟", options: ["زمین", "طبیعت", "صبر", "آب"], answer: "زمین" },
        { riddle: "آن چیست که هر چه می‌خورد چاق نمی‌شود؟", options: ["آسیاب", "کرم", "آتش", "موریانه"], answer: "آسیاب" },
        { riddle: "آن چیست که چیستان است؟", options: ["راز", "معما", "سوال", "کلمه"], answer: "معما" },
        { riddle: "کدام حیوان است که اگر سرش را ببری عضوی از بدن می‌شود؟", options: ["گرگ", "مار", "شیر", "خرس"], answer: "گرگ" },
        { riddle: "آن چیست که با گریه وارد می‌شود و با گریه بدرقه می‌شود؟", options: ["انسان", "باران", "غم", "شادی"], answer: "انسان" },
        { riddle: "آن چیست که وقتی راه می‌رود رد پا ندارد؟", options: ["کشتی", "ماهی", "قطار", "هواپیما"], answer: "کشتی" },
        { riddle: "آن چیست که هر چه تقسیمش کنی کم نمی‌شود؟", options: ["مهربانی", "دانش", "شادی", "همه موارد"], answer: "همه موارد" }
    ];

    // --- Variables ---
    let gameState = { highScore: 0, coins: 500, skipTickets: 0 };
    let score = 0;
    let lives = 3;
    let currentRiddleIndex = 0;
    let shuffledRiddles = [];
    let currentMode = 'old'; 
    let timerInterval;
    let timeLeft = 30;
    
    // Challenge Specifics
    let isChallengeMode = false;
    let challengeStreak = 0;

    const normalize = (str) => str.trim().replace(/ی/g, 'ي').replace(/ک/g, 'ك');

    // --- Navigation ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (id === 'main-menu-screen') updateMenuUI();
    }

    function showToast(msg) {
        const t = document.getElementById('toast-modal');
        const p = document.getElementById('toast-msg');
        if(msg) p.textContent = msg;
        else p.textContent = "⚠️ این بخش به زودی اضافه می‌شود";
        
        t.style.opacity = '1';
        t.style.transform = 'translate(-50%, 0)';
        setTimeout(() => {
            t.style.opacity = '0';
            t.style.transform = 'translate(-50%, -20px)';
        }, 2000);
    }

    // --- Modal Logic ---
    const modeModal = document.getElementById('mode-modal');
    const challengeModal = document.getElementById('challenge-modal');

    document.getElementById('open-mode-modal-btn').onclick = () => {
        modeModal.classList.remove('hidden');
    };
    document.getElementById('close-mode-btn').onclick = () => {
        modeModal.classList.add('hidden');
    };

    // Challenge Modal Triggers
    document.getElementById('daily-challenge-btn').onclick = () => {
        challengeModal.classList.remove('hidden');
    };
    document.getElementById('close-challenge-btn').onclick = () => {
        challengeModal.classList.add('hidden');
    };

    function selectMode(mode) {
        currentMode = mode;
        isChallengeMode = false;
        modeModal.classList.add('hidden');
        startGame();
    }

    // --- Challenge Logic ---
    function startChallengeRun() {
        challengeModal.classList.add('hidden');
        currentMode = 'flash';
        isChallengeMode = true;
        challengeStreak = 0;
        startGame();
    }

    // --- Game Logic ---
    function updateMenuUI() {
        document.getElementById('menu-score').textContent = gameState.highScore;
        document.getElementById('menu-coins').textContent = gameState.coins;
        document.getElementById('menu-tickets').textContent = gameState.skipTickets || 0;
    }

    function startGame() {
        score = 0;
        currentRiddleIndex = 0;
        shuffledRiddles = [...riddles].sort(() => Math.random() - 0.5);
        
        // UI Reset
        document.getElementById('score-display').classList.remove('hidden');
        document.getElementById('challenge-progress').classList.add('hidden');
        document.getElementById('skip-btn').classList.add('hidden');

        if(isChallengeMode) {
            lives = 1; 
            document.getElementById('score-display').classList.add('hidden');
            document.getElementById('challenge-progress').classList.remove('hidden');
            document.getElementById('challenge-count').textContent = '0';
            document.getElementById('options-container').classList.add('hidden');
            document.getElementById('flash-container').classList.remove('hidden');
            document.getElementById('timer-bar-container').classList.remove('hidden');
            document.getElementById('game-stats').textContent = '⚠️ چالش';
        } else if(currentMode === 'old') {
            lives = 3;
            document.getElementById('options-container').classList.remove('hidden');
            document.getElementById('flash-container').classList.add('hidden');
            document.getElementById('timer-bar-container').classList.add('hidden');
            document.getElementById('game-stats').textContent = '❤️ ' + lives;
        } else {
            // Flash Normal
            document.getElementById('options-container').classList.add('hidden');
            document.getElementById('flash-container').classList.remove('hidden');
            document.getElementById('timer-bar-container').classList.remove('hidden');
            document.getElementById('game-stats').textContent = '⏳ 30';
        }
        
        // Show Skip Button if user has tickets and NOT in challenge mode
        if(!isChallengeMode && gameState.skipTickets > 0) {
            document.getElementById('skip-btn').classList.remove('hidden');
        }

        showScreen('gameplay-screen');
        loadRiddle();
    }

    function loadRiddle() {
        if(currentRiddleIndex >= shuffledRiddles.length) {
            endGame();
            return;
        }

        const data = shuffledRiddles[currentRiddleIndex];
        document.getElementById('riddle-text').textContent = data.riddle;
        document.getElementById('game-score').textContent = score;

        // Reset inputs
        const input = document.getElementById('flash-input');
        input.value = '';
        input.classList.remove('correct-flash', 'wrong-flash');

        if(currentMode === 'old' && !isChallengeMode) {
            setupOldMode(data);
        } else {
            setupFlashMode(data);
        }
    }

    function setupOldMode(data) {
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        let opts = [...data.options].sort(() => Math.random() - 0.5);
        
        opts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.textContent = opt;
            btn.onclick = () => checkOldAnswer(btn, opt, data.answer);
            container.appendChild(btn);
        });
    }

    function checkOldAnswer(btn, selected, correctText) {
        const buttons = document.querySelectorAll('.btn-option');
        buttons.forEach(b => b.disabled = true);

        if(selected === correctText) {
            btn.classList.add('correct-flash');
            score += 10;
            gameState.coins += 5;
            setTimeout(nextQuestion, 1200);
        } else {
            btn.classList.add('wrong-flash');
            lives--;
            document.getElementById('game-stats').textContent = '❤️ ' + lives;
            buttons.forEach(b => {
                if(b.textContent === correctText) b.classList.add('correct-flash');
            });
            
            if(lives <= 0) setTimeout(endGame, 1500);
            else setTimeout(nextQuestion, 1500);
        }
    }

    function setupFlashMode(data) {
        const input = document.getElementById('flash-input');
        input.focus();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 30;
        updateTimerUI();
        
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerUI();
            if(timeLeft <= 0) {
                handleFlashTimeOut();
            }
        }, 1000);
    }

    function updateTimerUI() {
        if(!isChallengeMode) document.getElementById('game-stats').textContent = '⏳ ' + timeLeft;
        const pct = (timeLeft / 30) * 100;
        document.getElementById('timer-bar').style.width = pct + '%';
        if(timeLeft < 5) document.getElementById('timer-bar').style.backgroundColor = '#ef4444';
        else document.getElementById('timer-bar').style.backgroundColor = '#FFD700';
    }

    function handleFlashTimeOut() {
        clearInterval(timerInterval);
        const input = document.getElementById('flash-input');
        input.classList.add('wrong-flash');
        
        if(isChallengeMode) {
            // Fail challenge
            showToast("زمان تمام شد! چالش باختید.");
            setTimeout(() => {
                showScreen('main-menu-screen');
            }, 1500);
        } else {
            setTimeout(endGame, 1000);
        }
    }

    function checkFlashAnswer() {
        const input = document.getElementById('flash-input');
        const userVal = normalize(input.value);
        const correctVal = normalize(shuffledRiddles[currentRiddleIndex].answer);

        if(userVal === correctVal) {
            clearInterval(timerInterval);
            input.classList.add('correct-flash');
            
            if(isChallengeMode) {
                challengeStreak++;
                document.getElementById('challenge-count').textContent = challengeStreak;
                if(challengeStreak >= 3) {
                    setTimeout(winChallenge, 1000);
                    return;
                }
            } else {
                score += 20;
                gameState.coins += 10;
            }
            setTimeout(nextQuestion, 1000);
        } else {
            input.classList.add('wrong-flash');
            setTimeout(() => input.classList.remove('wrong-flash'), 500);
        }
    }

    function winChallenge() {
        gameState.skipTickets = (gameState.skipTickets || 0) + 1;
        saveData();
        
        document.getElementById('game-over-title').textContent = "تبریک!";
        document.getElementById('game-over-title').className = "text-5xl font-black mb-6 text-indigo-400";
        document.getElementById('game-over-msg').innerHTML = "شما برنده <span class='text-white font-bold'>یک بلیط رد کردن</span> شدید!";
        document.getElementById('final-score').parentElement.style.display = 'none'; // Hide score
        
        showScreen('game-over-screen');
    }

    function useSkipTicket() {
        if(gameState.skipTickets > 0) {
            gameState.skipTickets--;
            saveData();
            clearInterval(timerInterval); // Stop current timer
            showToast("سوال رد شد! (تعداد بلیط: " + gameState.skipTickets + ")");
            
            // Hide button if no tickets left
            if(gameState.skipTickets <= 0) document.getElementById('skip-btn').classList.add('hidden');
            
            // Go to next
            nextQuestion();
        }
    }

    function nextQuestion() {
        currentRiddleIndex++;
        loadRiddle();
    }

    function endGame() {
        clearInterval(timerInterval);
        if(!isChallengeMode && score > gameState.highScore) gameState.highScore = score;
        saveData();
        
        document.getElementById('game-over-title').textContent = "پایان بازی";
        document.getElementById('game-over-title').className = "text-5xl font-black mb-6 gold-text";
        document.getElementById('game-over-msg').innerHTML = 'امتیاز شما: <span id="final-score" class="text-white">0</span>';
        document.getElementById('final-score').parentElement.style.display = 'block';
        document.getElementById('final-score').textContent = score;
        
        showScreen('game-over-screen');
    }

    function saveData() {
        localStorage.setItem('houshyar_game_data', JSON.stringify(gameState));
    }

    // --- Event Listeners ---
    document.getElementById('flash-submit-btn').addEventListener('click', checkFlashAnswer);
    document.getElementById('flash-input').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') checkFlashAnswer();
    });

    document.getElementById('play-again-btn').addEventListener('click', () => {
         startGame();
    });
    
    document.getElementById('back-to-menu-btn').addEventListener('click', () => showScreen('main-menu-screen'));
    document.getElementById('exit-game-btn').addEventListener('click', () => {
        clearInterval(timerInterval);
        showScreen('main-menu-screen');
    });
    
    document.getElementById('challenges-btn').addEventListener('click', () => showToast('آرشیو سوالات هنوز فعال نیست'));
    document.getElementById('settings-btn').addEventListener('click', () => showToast());

    // Init
    window.onload = function() {
        const saved = localStorage.getItem('houshyar_game_data');
        if(saved) {
            const parsed = JSON.parse(saved);
            gameState.highScore = parsed.highScore || 0;
            gameState.coins = parsed.coins || 500;
            gameState.skipTickets = parsed.skipTickets || 0;
        }
        updateMenuUI();
    };

</script>
</body>
</html>
